<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f4"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Refeições"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>Refeições</title></head><body><main class="app"><header class="header"><div><p id="today" class="eyebrow"></p><h1>Olá! 👋</h1><p class="subtitle">Controle as refeições por pagar.</p></div><button id="exportButton" class="round-button" aria-label="Exportar cópia de segurança">⇧</button></header><section class="daily-card"><div class="card-top"><span class="card-label">REFEIÇÕES POR PAGAR</span><span>◷</span></div><div class="daily-number"><strong id="totalCount">0</strong><span>refeições</span></div><p id="totalSummary">Sem refeições por pagar</p><div class="card-actions"><button id="paidButton">✓ Marcar como pago</button></div></section><section class="history-section"><div class="section-heading"><h2>Registos recentes</h2><button id="importButton" class="link-button">Importar</button></div><input id="importFile" type="file" accept="application/json" hidden><div id="mealList" class="meal-list"></div></section></main><button id="addButton" class="add-button"><b>+</b><span>Adicionar refeição</span></button><div id="backdrop" class="backdrop hidden"></div><section id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="handle"></div><div class="sheet-heading"><div><p id="formKicker" class="eyebrow">NOVO REGISTO</p><h2 id="formTitle">Adicionar refeição</h2></div><button id="closeButton" class="round-button">×</button></div><form id="mealForm"><fieldset><legend>Tipo de registo</legend><div class="entry-mode"><label><input type="radio" name="entryMode" value="meal" checked><span>+ Refeição</span></label><label class="credit"><input type="radio" name="entryMode" value="credit"><span>− Crédito</span></label></div></fieldset><fieldset><legend>Quando foi a refeição?</legend><div class="choice-grid two"><label class="choice"><input type="radio" name="mealType" value="Almoço" checked><span><i>☀️</i>Almoço</span></label><label class="choice"><input type="radio" name="mealType" value="Jantar"><span><i>🌙</i>Jantar</span></label></div></fieldset><fieldset><legend>O que foi servido?</legend><div class="choice-grid"><label class="choice"><input type="radio" name="content" value="Refeição" checked><span><i>🍽️</i>Refeição</span></label><label class="choice"><input type="radio" name="content" value="Peixe"><span><i>🐟</i>Peixe</span></label><label class="choice"><input type="radio" name="content" value="Gambas"><span><i>🦐</i>Gambas</span></label><label class="choice"><input type="radio" name="content" value="Salgados"><span><i>🥟</i>Salgados</span></label></div></fieldset><div class="form-grid"><label>Data<input id="date" type="date" required></label><label>N.º de refeições<div class="quantity"><button type="button" id="decrease">−</button><input id="quantity" type="number" min="1" max="99" value="1" inputmode="numeric" required><button type="button" id="increase">+</button></div></label></div><div id="editActions" class="edit-actions hidden"><button type="button" id="deleteButton" class="delete-button">Eliminar registo</button></div><button id="saveButton" class="save-button" type="submit">Guardar registo <span>→</span></button></form></section><div id="toast" class="toast hidden" role="status"></div><script src="app.js"></script></body></html>
